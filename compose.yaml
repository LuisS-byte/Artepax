services:
  db:
    image: postgres:18-bookworm
    environment:
      POSTGRES_DB: artepax
      POSTGRES_USER: ${DB_USER:-artepax}
      POSTGRES_PASSWORD: ${DB_PASS:?Set DB_PASS in .env}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./database/init.sql:/docker-entrypoint-initdb.d/10-artepax.sql:ro
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 24

  mailpit:
    image: axllent/mailpit:v1.31.2
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
    networks: [backend, local]

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      DB_URL: jdbc:postgresql://db:5432/artepax
      DB_USER: ${DB_USER:-artepax}
      DB_PASS: ${DB_PASS:?Set DB_PASS in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-local-demo.invalid}
      FRONTEND_URLS: ${FRONTEND_URLS:-http://localhost:5500,http://127.0.0.1:5500}
      MAIL_USERNAME: artepax@example.invalid
      MAIL_PASSWORD: ""
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: "1025"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "false"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "false"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED: "false"
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    volumes:
      - documents:/app/storage
    networks: [backend, local]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://127.0.0.1:8080/v3/api-docs"]
      start_period: 45s
      interval: 10s
      timeout: 5s
      retries: 12

networks:
  backend:
    internal: true
  local:

volumes:
  pgdata:
  documents:
