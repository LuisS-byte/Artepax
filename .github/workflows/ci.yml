name: Artepax CI

on:
  push:
    branches: [main, chore/reproducible-demo]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  maven:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DB_USER: artepax
      DB_PASS: isolated-ci-only
      GOOGLE_CLIENT_ID: local-demo.invalid
      MAIL_USERNAME: artepax@example.invalid
      MAIL_PASSWORD: ""
      SPRING_TASK_SCHEDULING_ENABLED: "false"
      SPRING_MAIL_HOST: localhost
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_DB: artepax
          POSTGRES_USER: artepax
          POSTGRES_PASSWORD: isolated-ci-only
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U artepax -d artepax"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Restore and verify PostgreSQL
        run: |
          docker exec -i "${{ job.services.postgres.id }}" psql -X -v ON_ERROR_STOP=1 -U artepax -d artepax < database/init.sql
          docker exec -i "${{ job.services.postgres.id }}" psql -X -v ON_ERROR_STOP=1 -U artepax -d artepax < database/verify.sql
      - name: Build and run Maven tests
        env:
          DB_URL: jdbc:postgresql://127.0.0.1:${{ job.services.postgres.ports[5432] }}/artepax
        run: |
          export JWT_SECRET="$(openssl rand -base64 32)"
          bash ./mvnw --batch-mode --no-transfer-progress verify
      - name: Run integration tests with Testcontainers
        if: ${{ !cancelled() }}
        run: bash ./mvnw --batch-mode --no-transfer-progress '-Dtest=*IT' test

  compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Prepare ephemeral demo values
        run: |
          db_password="$(openssl rand -hex 24)"
          jwt_secret="$(openssl rand -base64 32)"
          admin_password="$(openssl rand -hex 24)"
          echo "::add-mask::$db_password"
          echo "::add-mask::$jwt_secret"
          echo "::add-mask::$admin_password"
          printf 'DB_PASS=%s\nJWT_SECRET=%s\n' "$db_password" "$jwt_secret" > .env
          printf 'ARTEPAX_ADMIN_EMAIL=admin@example.invalid\nARTEPAX_ADMIN_PASSWORD=%s\n' "$admin_password" >> "$GITHUB_ENV"
      - name: Build and start the stack
        run: |
          docker compose config --quiet
          docker compose up --build --wait --wait-timeout 240
      - name: Verify schema, add admin and exercise the API
        run: |
          docker compose exec -T db psql -X -v ON_ERROR_STOP=1 -U artepax -d artepax < database/verify.sql
          python -m venv "$RUNNER_TEMP/artepax-venv"
          "$RUNNER_TEMP/artepax-venv/bin/python" -m pip install 'bcrypt==4.3.0'
          "$RUNNER_TEMP/artepax-venv/bin/python" database/bootstrap_admin.py --ci
          "$RUNNER_TEMP/artepax-venv/bin/python" database/smoke.py
          docker compose exec -T app test -w /app/storage/documentos
      - name: Show service state on failure
        if: failure()
        run: docker compose ps --all
      - name: Remove this ephemeral stack
        if: always()
        run: |
          if test -f .env; then docker compose down --volumes; fi
