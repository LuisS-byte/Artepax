spring.application.name=Artepax

server.port=8080

# ========================
# DATABASE
# ========================
spring.datasource.url=jdbc:postgresql://localhost:5432/Artepax
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver

# ========================
# GOOGLE AUTH
# ========================
google.client.id=${GOOGLE_CLIENT_ID}

# ========================
# JPA
# ========================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ========================
# JWT
# ========================
app.jwt.secret=${JWT_SECRET}
app.jwt.exp-hours=4

# ========================
# CORS
# ========================
app.cors.allowed-origins=${FRONTEND_URLS:http://localhost:5500,http://127.0.0.1:5500}

# ========================
# Scheduling-
# ========================
spring.task.scheduling.pool.size=5
artepax.job.cancelacion.intervalo-ms=60000

# ========================
# EMAIL (Gmail SMTP)
# ========================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

app.mail.from=${MAIL_USERNAME}
app.mail.from-name=prartepax